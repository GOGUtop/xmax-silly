name: Build HarmonyOS 7 HAP (API 26)

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: Build mode
        required: true
        default: debug
        type: choice
        options:
          - debug
          - release
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ inputs.build_mode || 'debug' }} HAP - HarmonyOS 7 / API 26
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    env:
      BUILD_MODE: ${{ inputs.build_mode || 'debug' }}
      HARMONY_CLI_VERSION: 26.0.0.821

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux prerequisites
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # HarmonyOS 7.0 = API 26.0.0.  This action installs the matching
      # HarmonyOS Command Line Tools + SDK on the GitHub Linux runner.
      - name: Set up HarmonyOS 7 / API 26 toolchain
        uses: ErBWs/setup-ohos@v2
        with:
          version: ${{ env.HARMONY_CLI_VERSION }}
          cache: true

      - name: Verify toolchain
        shell: bash
        run: |
          set -euxo pipefail
          command -v hvigorw
          command -v ohpm
          hvigorw --version
          ohpm --version
          echo "HOS_SDK_HOME=${HOS_SDK_HOME:-}"
          echo "OHOS_NDK_HOME=${OHOS_NDK_HOME:-}"

      - name: Verify project API 26 configuration
        shell: bash
        run: |
          set -euxo pipefail
          echo "=== root build-profile.json5 ==="
          cat build-profile.json5
          echo "=== hvigor/hvigor-config.json5 ==="
          cat hvigor/hvigor-config.json5
          if grep -Eq '"compileSdkVersion"[[:space:]]*:[[:space:]]*"?(6\.1\.0\(23\)|23)"?' build-profile.json5; then
            echo "ERROR: repository still uses API 23 in build-profile.json5" >&2
            exit 23
          fi
          grep -Eq '"compileSdkVersion"[[:space:]]*:[[:space:]]*"26\.0\.0"' build-profile.json5
          grep -Eq '"targetSdkVersion"[[:space:]]*:[[:space:]]*"26\.0\.0"' build-profile.json5
          grep -Eq '"modelVersion"[[:space:]]*:[[:space:]]*"26\.0\.0"' hvigor/hvigor-config.json5

      - name: Install OHPM dependencies
        shell: bash
        run: |
          set -euxo pipefail
          ohpm config set registry https://ohpm.openharmony.cn/ohpm/ || true
          ohpm install --all

      - name: Build HAP
        shell: bash
        run: |
          set -euxo pipefail
          hvigorw clean --no-daemon || true
          hvigorw assembleHap \
            --mode module \
            -p product=default \
            -p module=entry@default \
            -p buildMode="$BUILD_MODE" \
            --no-daemon \
            --stacktrace

      - name: Show build outputs
        if: always()
        shell: bash
        run: |
          echo "=== HAP / APP outputs ==="
          find entry/build -type f \( -name '*.hap' -o -name '*.app' \) -print 2>/dev/null || true

      - name: Upload HAP artifact
        uses: actions/upload-artifact@v4
        with:
          name: SillyTavern-HarmonyOS7-API26-${{ env.BUILD_MODE }}-${{ github.run_number }}
          path: |
            entry/build/**/*.hap
          if-no-files-found: error
          retention-days: 14
